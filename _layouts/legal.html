<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - 러닝펜슬</title>
    <meta name="description" content="{{ page.description }}" />
    {%- if page.noindex %}
    <meta name="robots" content="noindex" />
    {%- endif %}
    <meta name="theme-color" content="#F2B134" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="러닝펜슬" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "ink": "#2B2B2B",
                        "accent": "#7C580D",
                        "muted": "#4A463F",
                        "muted-2": "#57534C",
                        "line": "#E4E0D6",
                    },
                },
            },
        }
    </script>
    <style>
        /* ── 공통: 바탕 · 머리말 · 바닥글 ──
           네 페이지(index · privacy-policy · terms · data-deletion)가 이 묶음을 똑같이 복사해 쓴다. 고칠 때는 네 파일을 함께 고친다. */
        html { background: #F2B134; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { margin: 0; overflow-x: clip; font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; color: #2B2B2B; background: #FAFAF7; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        *, *::before, *::after { box-sizing: border-box; }
        :focus-visible { outline: 3px solid #1E5AA8; outline-offset: 3px; }
        .rp-wrap { max-width: 1200px; margin-left: auto; margin-right: auto; padding-left: clamp(20px, 5vw, 64px); padding-right: clamp(20px, 5vw, 64px); }
        .rp-head { background: #F2B134; line-height: normal; }
        .rp-head-in { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 20px; padding-bottom: 20px; }
        .rp-brand { display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: #2B2B2B; }
        .rp-brand-tile { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: #FAFAF7; }
        .rp-brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
        .rp-nav { display: flex; align-items: center; gap: 28px; font-size: 16px; font-weight: 600; }
        .rp-nav a { text-decoration: none; color: #2B2B2B; }
        .rp-nav a:hover { text-decoration: underline; }
        .rp-foot { background: #2B2B2B; color: #D8D4CB; padding: clamp(40px, 5vw, 64px) 0; line-height: normal; }
        .rp-foot p { margin: 0; }
        .rp-foot-in { display: flex; flex-direction: column; gap: 28px; }
        .rp-foot-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 24px; }
        .rp-foot-brand { display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
        .rp-foot-logo { display: flex; align-items: center; gap: 10px; }
        .rp-foot-logo .rp-brand-tile { background: #F2B134; }
        .rp-foot-logo .rp-brand-name { color: #FAFAF7; }
        .rp-foot-nav { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; font-weight: 600; }
        .rp-foot-nav a { display: inline-flex; align-items: center; min-height: 44px; color: #FAFAF7; text-decoration: none; }
        .rp-foot-nav a:hover { text-decoration: underline; }
        .rp-foot-legal { display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid #4A4844; font-size: 13px; line-height: 1.6; color: #B5B0A7; }
        @media (max-width: 860px) { .rp-nav { display: none; } }

        /* ── 법적 페이지 전용 ── 모눈종이 바탕. 글이 짧아도 바닥글이 화면 아래에 붙는다 */
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1 0 auto; }
        .rp-grid { background-color: #F5F9FC; background-image: linear-gradient(#D3E2EF 1px, transparent 1px), linear-gradient(90deg, #D3E2EF 1px, transparent 1px); background-size: 32px 32px; }
    </style>
</head>

<body>
{% include header.html %}

    <main class="rp-grid">
        <div class="mx-auto max-w-[800px] px-6 py-[clamp(48px,6vw,80px)]">
            <article class="rounded-[28px] border-[1.5px] border-line bg-white p-7 md:p-12">
                <span class="text-sm font-bold tracking-[0.04em] text-accent">{{ page.eyebrow }}</span>
                <h1 class="mt-3.5 text-[clamp(30px,6.5vw,42px)] font-black leading-[1.25] tracking-[-1px]">{{ page.heading | default: page.title }}</h1>
                {%- if page.updated %}
                <p class="mt-3 text-[13px] text-muted-2">최종 업데이트: {{ page.updated }}</p>
                {%- endif %}
                <div class="mt-10 space-y-8 leading-[1.7] text-muted">
{{ content | rstrip }}
                </div>
            </article>
        </div>
    </main>

{% include footer.html %}
</body>

</html>
