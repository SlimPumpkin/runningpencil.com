<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - 러닝펜슬</title>
    <meta name="description" content="{{ page.description }}" />
    {%- if page.noindex %}
    <meta name="robots" content="noindex" />
    {%- endif %}
    <meta name="theme-color" content="#F2B134" />
    <script src="https://cdn.tailwindcss.com"></script>
{% include head-links.html %}
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "ink": "#2B2B2B",
                        "accent": "#7C580D",
                        "muted": "#4A463F",
                        "muted-2": "#57534C",
                        "line": "#E4E0D6",
                    },
                },
            },
        }
    </script>
    <style>
{% include css/common.css %}

{% include css/legal.css %}
    </style>
</head>

<body>
{% include header.html %}

    <main class="rp-grid">
        <div class="rp-legal-wrap">
            <article class="rp-legal-card">
                <span class="rp-legal-eyebrow">{{ page.eyebrow }}</span>
                <h1 class="rp-legal-title">{{ page.heading | default: page.title }}</h1>
                {%- if page.updated %}
                <p class="rp-legal-updated">최종 업데이트: {{ page.updated }}</p>
                {%- endif %}
                <div class="rp-doc">
{{ content | rstrip }}
                </div>
            </article>
        </div>
    </main>

{% include footer.html %}
</body>

</html>
