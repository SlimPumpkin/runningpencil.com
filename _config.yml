# GitHub Pages 설정 — 사이트에 올리지 않을 파일.
#
# GitHub Pages 는 브랜치를 배포할 때 Jekyll 3.10.0 으로 사이트를 빌드한다. 로컬도 Gemfile 로 같은 버전을 쓴다.
# 그때 마크다운 파일이 원문 그대로(/CLAUDE.md, /README.md), 또 페이지로 바뀌어(/CLAUDE.html) 사이트에 공개된다.
# 저장소 안내 문서가 사이트에 올라가지 않도록 여기서 뺀다. 마크다운 문서를 새로 추가하면 이 목록에도 적는다.
#
# CNAME 은 GitHub Pages 가 원래부터 사이트에 올리지 않던 파일이다. exclude 를 직접 적으면 그 기본값이
# 사라지므로 함께 적어 둔다. 도메인 연결은 저장소의 CNAME 파일이 맡으며, 이 목록과는 상관없다.
# exclude 를 직접 적으면 Jekyll 기본 제외 목록(Gemfile, Gemfile.lock, vendor/ 등)도 사라지므로, 사이트에 올리지 않을 것은 모두 여기에 적는다. 점(.)이나 밑줄(_)로 시작하는 항목은 이 목록과 상관없이 출력되지 않는다.

# 사이트의 정식 주소. 지금 출력에는 영향이 없다.
url: "https://runningpencil.com"
exclude:
  - CNAME
  - CLAUDE.md
  - README.md
  - .planning/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - prepare/
  - scripts/
  - .githooks/
